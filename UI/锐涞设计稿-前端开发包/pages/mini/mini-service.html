<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>售后 · 锐涞小程序</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:750px;height:1260px;overflow:hidden;}
body{font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;background:#F3F5F9;color:#1A2B4A;-webkit-font-smoothing:antialiased;}
.app{position:relative;width:750px;height:1260px;display:flex;flex-direction:column;background:#F3F5F9;}

/* ===== 状态栏 ===== */
.statusbar{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 40px;font-size:24px;font-weight:600;color:#1A2B4A;}
.sb-right{display:flex;align-items:center;gap:10px;}

/* ===== 顶部品牌栏 ===== */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 32px 0;}
.brand{display:flex;align-items:center;gap:14px;}
.brand-logo{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#2B7BF0,#1A68D7);color:#fff;font-size:26px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 18px rgba(26,104,215,.32);}
.brand-name{font-size:30px;font-weight:700;color:#1A2B4A;line-height:1;}
.brand-sub{font-size:17px;color:#9AA6BA;letter-spacing:1.6px;margin-top:6px;}
.role-sw{display:flex;background:#E8EDF5;border-radius:11px;padding:5px;gap:2px;}
.role-sw span{padding:9px 22px;font-size:22px;color:#7A879C;border-radius:8px;line-height:1;}
.role-sw span.on{background:#fff;color:#1A68D7;font-weight:600;box-shadow:0 2px 8px rgba(22,32,64,.10);}

/* ===== 页头 ===== */
.pagehead{padding:22px 32px 0;}
.page-title{font-size:36px;font-weight:700;color:#1A2B4A;line-height:1;}
.page-sub{font-size:19px;color:#8A97AD;margin-top:8px;}
.tabs{display:flex;gap:8px;padding:20px 36px 0;border-bottom:1px solid #E6EAF2;margin:0 32px;}
.tab{padding:12px 14px 16px;font-size:27px;color:#7A879C;position:relative;font-weight:500;}
.tab.on{color:#1A68D7;font-weight:700;}
.tab.on::after{content:"";position:absolute;left:16px;right:16px;bottom:-1px;height:6px;border-radius:3px;background:linear-gradient(90deg,#1A68D7,#2B7BF0);box-shadow:0 3px 8px rgba(26,104,215,.35);}
.tab .bd{display:inline-block;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:#DE4B4B;color:#fff;font-size:15px;font-weight:700;text-align:center;line-height:22px;margin-left:6px;vertical-align:2px;}

/* ===== 填写按钮组 ===== */
.btns{display:flex;gap:14px;margin:20px 32px 0;}
.btn-soft{flex:1;height:82px;border:1px solid #D7E3F7;border-radius:16px;background:#F5F9FF;display:flex;align-items:center;justify-content:center;color:#1A68D7;font-size:21px;font-weight:600;line-height:1.35;text-align:center;padding:0 8px;}

/* ===== 筛选面板 ===== */
.filter-panel{margin:16px 32px 0;background:#fff;border:1px solid #E3E9F2;border-radius:20px;padding:18px 22px 20px;box-shadow:0 8px 22px rgba(22,32,64,.05);}
.f-row{display:flex;align-items:center;gap:12px;}
.f-label{font-size:21px;color:#7A879C;white-space:nowrap;}
.seg{display:flex;background:#F1F4F9;border-radius:9px;padding:4px;flex:1;}
.seg span{flex:1;text-align:center;padding:9px 0;font-size:21px;color:#7A879C;border-radius:7px;position:relative;white-space:nowrap;}
.seg span.on{background:#fff;color:#1A68D7;font-weight:700;box-shadow:0 2px 6px rgba(22,32,64,.08);}
.seg span .bd{position:absolute;top:2px;right:2px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:#DE4B4B;color:#fff;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.f-row2{display:flex;align-items:center;gap:12px;margin-top:14px;}
.date-box{flex:1;height:50px;border:1px solid #E3E9F2;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;color:#B4BECD;background:#FBFCFE;}
.sn-box{flex:1.4;height:50px;border:1px solid #E3E9F2;border-radius:12px;display:flex;align-items:center;padding:0 18px;font-size:22px;color:#B4BECD;background:#FBFCFE;}
.sn-box svg{margin-left:auto;flex:0 0 auto;}

/* ===== 退货列表 ===== */
.returns{margin:16px 32px 0;display:flex;flex-direction:column;gap:16px;}
.ret{background:#fff;border:1px solid #E3E9F2;border-radius:20px;padding:20px 24px 18px;box-shadow:0 8px 22px rgba(22,32,64,.05);}
.r-top{display:flex;align-items:center;justify-content:space-between;}
.r-no{font-family:Consolas,"SFMono-Regular",monospace;font-size:25px;font-weight:600;color:#1A68D7;letter-spacing:.4px;}
.type-chip{font-size:19px;color:#1A68D7;background:#EAF2FE;padding:5px 14px;border-radius:10px;font-weight:600;white-space:nowrap;}
.r-reason{display:flex;align-items:center;gap:10px;margin-top:12px;}
.reason-tag{font-size:19px;color:#7A879C;background:#F1F4F9;padding:5px 12px;border-radius:9px;font-weight:600;}
.r-desc{font-size:23px;color:#1A2B4A;line-height:1.45;}
.r-sn{margin-top:12px;font-size:19px;color:#9AA6BA;font-family:Consolas,"SFMono-Regular",monospace;}

/* ===== 底部导航 ===== */
.tabbar{margin-top:auto;background:#fff;border-top:1px solid #EDF1F7;display:flex;padding:14px 0 20px;}
.tb{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:20px;color:#8A97AD;font-weight:500;}
.tb .ico{width:46px;height:44px;display:flex;align-items:center;justify-content:center;}
.tb.on{color:#1A68D7;font-weight:700;}
</style>
</head>
