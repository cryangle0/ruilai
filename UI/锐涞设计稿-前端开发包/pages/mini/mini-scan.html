<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>扫码 · 锐涞小程序</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:750px;height:1334px;overflow:hidden;}
body{font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;background:#F3F5F9;color:#1A2B4A;-webkit-font-smoothing:antialiased;}
.app{position:relative;width:750px;height:1334px;display:flex;flex-direction:column;background:#F3F5F9;}

/* ===== 状态栏 ===== */
.statusbar{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 40px;font-size:24px;font-weight:600;color:#1A2B4A;}
.sb-right{display:flex;align-items:center;gap:10px;}

/* ===== 顶部品牌栏 ===== */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 32px 0;}
.brand{display:flex;align-items:center;gap:14px;}
.brand-logo{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#2B7BF0,#1A68D7);color:#fff;font-size:26px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 18px rgba(26,104,215,.32);}
.brand-name{font-size:30px;font-weight:700;color:#1A2B4A;line-height:1;}
.brand-sub{font-size:17px;color:#9AA6BA;letter-spacing:1.6px;margin-top:6px;}
.role-sw{display:flex;background:#E8EDF5;border-radius:11px;padding:5px;gap:2px;}
.role-sw span{padding:9px 22px;font-size:22px;color:#7A879C;border-radius:8px;line-height:1;}
.role-sw span.on{background:#fff;color:#1A68D7;font-weight:600;box-shadow:0 2px 8px rgba(22,32,64,.10);}

/* ===== 问候卡片 ===== */
.hero{margin:24px 32px 0;background:linear-gradient(135deg,#1A68D7 0%,#2B7BF0 58%,#54A0F8 100%);border-radius:26px;padding:32px 36px 34px;color:#fff;position:relative;overflow:hidden;}
.hero .greet{font-size:23px;color:rgba(255,255,255,.82);}
.hero .name{font-size:44px;font-weight:700;margin-top:10px;letter-spacing:.5px;}
.hero .sub{font-size:22px;color:rgba(255,255,255,.78);margin-top:14px;letter-spacing:.3px;}
.hero .wave{position:absolute;right:-30px;bottom:-46px;width:280px;height:280px;border-radius:36% 64% 55% 45%/52% 42% 58% 48%;background:rgba(255,255,255,.08);transform:rotate(24deg);}
.hero .wave2{position:absolute;right:120px;bottom:-90px;width:240px;height:240px;border-radius:44% 56% 48% 52%/58% 48% 52% 42%;background:rgba(255,255,255,.06);transform:rotate(-18deg);}

/* ===== 数据/扫码标签 ===== */
.ptabs{display:flex;gap:10px;padding:28px 36px 0;border-bottom:1px solid #E6EAF2;margin:0 32px;}
.ptab{padding:12px 14px 16px;font-size:27px;color:#7A879C;position:relative;font-weight:500;}
.ptab.on{color:#1A68D7;font-weight:700;}
.ptab.on::after{content:"";position:absolute;left:18px;right:18px;bottom:-1px;height:6px;border-radius:3px;background:linear-gradient(90deg,#1A68D7,#2B7BF0);box-shadow:0 3px 8px rgba(26,104,215,.35);}

/* ===== 扫码操作区 ===== */
.sec{margin:30px 32px 0;}
.sec-title{font-size:25px;color:#1A2B4A;font-weight:600;margin-bottom:18px;display:flex;align-items:center;gap:10px;}
.sec-title::before{content:"";width:6px;height:24px;border-radius:3px;background:linear-gradient(180deg,#2B7BF0,#1A68D7);}
.scan-grid{display:flex;gap:20px;}
.scan-card{flex:1;background:#fff;border:1px solid #E3E9F2;border-radius:22px;padding:30px 26px 28px;box-shadow:0 10px 26px rgba(22,32,64,.06);display:flex;flex-direction:column;}
.scan-card .ic{width:68px;height:68px;border-radius:18px;display:flex;align-items:center;justify-content:center;margin-bottom:18px;}
.ic-b{background:#EAF2FD;color:#1A68D7;}
.ic-g{background:#E7F7F0;color:#1B9E5A;}
.scan-card .t{font-size:29px;font-weight:700;color:#1A2B4A;}
.scan-card .s{font-size:20px;color:#8A97AD;margin-top:10px;line-height:1.5;}

/* ===== 创建销售单 + 销售单卡片 ===== */
.sales{margin:30px 32px 0;}
.btn-create{width:100%;height:96px;display:flex;align-items:center;justify-content:center;gap:12px;background:linear-gradient(135deg,#2B7BF0,#1A68D7);border-radius:18px;color:#fff;font-size:29px;font-weight:700;box-shadow:0 10px 24px rgba(26,104,215,.35);}
.order-card{margin-top:22px;background:#fff;border:1px solid #E3E9F2;border-radius:22px;padding:28px 30px 26px;box-shadow:0 10px 26px rgba(22,32,64,.06);}
.order-no{font-family:Consolas,"SFMono-Regular",monospace;font-size:25px;font-weight:600;color:#1A68D7;letter-spacing:.5px;}
.order-info{font-size:24px;color:#1A2B4A;margin-top:14px;line-height:1.55;}
.order-prog{margin-top:20px;display:flex;align-items:center;gap:18px;}
.prog-bar{flex:1;height:12px;background:#EEF2F8;border-radius:7px;overflow:hidden;}
.prog-bar i{display:block;height:100%;width:33.4%;border-radius:7px;background:linear-gradient(90deg,#1A68D7,#2B7BF0);box-shadow:0 2px 8px rgba(26,104,215,.4);}
.prog-num{font-size:26px;font-weight:700;color:#1A68D7;}

/* ===== 底部导航 ===== */
.tabbar{margin-top:auto;background:#fff;border-top:1px solid #EDF1F7;display:flex;padding:14px 0 20px;}
.tb{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:20px;color:#8A97AD;font-weight:500;}
.tb .ico{width:46px;height:44px;display:flex;align-items:center;justify-content:center;}
.tb.on{color:#1A68D7;font-weight:700;}
</style>
</head>
<body>
<div class="app">

  <!-- 状态栏 -->
  <div class="statusbar">
    <span>9:41</span>
    <div class="sb-right">
      <svg width="26" height="14" viewBox="0 0 26 14" fill="none"><rect x="0.5" y="0.5" width="19" height="13" rx="4" stroke="#1A2B4A"/><rect x="2.5" y="2.5" width="13" height="9" rx="2" fill="#1A2B4A"/><rect x="21.5" y="4" width="2.5" height="6" rx="1" fill="#1A2B4A"/></svg>
      <svg width="24" height="14" viewBox="0 0 24 14" fill="none"><rect x="1" y="7.5" width="3.4" height="5.5" rx="1.2" fill="#1A2B4A"/><rect x="6.2" y="5" width="3.4" height="8" rx="1.2" fill="#1A2B4A"/><rect x="11.4" y="2.5" width="3.4" height="10.5" rx="1.2" fill="#1A2B4A"/><rect x="16.6" y="0.5" width="3.4" height="12.5" rx="1.2" fill="#1A2B4A"/></svg>
    </div>
  </div>

  <!-- 顶部品牌栏 -->
  <div class="topbar">
    <div class="brand">
      <div class="brand-logo">锐</div>

        <div class="brand-name">锐涞小程序</div>

      </div>
    </div>
    <div class="role-sw">
      <span class="on">一级</span><span>二级</span><span>子账号</span>

  <!-- 问候卡片 -->
  <div class="hero">

        </div>
        <div class="t">出货扫码</div>
        <div class="s">分销给二级</div>
      </div>
      <div class="scan-card">
        <div class="ic ic-g">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4 14h6l-1 8 9-12h-6l1-8z"/></svg>
        </div>
        <div class="t">直销激活</div>
        <div class="s">先扫码再填客户</div>
      </div>
    </div>
  </div>

  <!-- 创建销售单 + 进行中的销售单 -->
  <div class="sales">
    <div class="btn-create">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>

    </div>
    <div class="order-card">
      <div class="order-no">SO20260807095</div>
      <div class="order-info">杭州城西专营·锐涞经典款套件/M+腰带M×2</div>
      <div class="order-prog">
        <div class="prog-bar"><i></i></div>
        <span class="prog-num">2/6</span>
      </div>
    </div>
  </div>

  <!-- 底部导航 -->
  <div class="tabbar">
    <div class="tb on">
      <div class="ico">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-6h6v6"/></svg>
      </div>
      首页
    </div>
    <div class="tb">
      <div class="ico">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>
      </div>

    </div>
    <div class="tb">
      <div class="ico">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5v8l9 5 9-5V8z"/><path d="M3 8l9 5 9-5"/><path d="M12 13v8"/></svg>
      </div>
      库存
    </div>
    <div class="tb">
      <div class="ico">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4v5c0 4.5-3.2 7.8-8 9-4.8-1.2-8-4.5-8-9V7l8-4z"/><path d="M9 12l2 2 4-4"/></svg>
      </div>
      售后
    </div>
    <div class="tb">
      <div class="ico">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/></svg>
      </div>

    </div>

</div>
</body>
</html>
